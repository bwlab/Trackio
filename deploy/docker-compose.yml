# Deploy layout (server.bwlab.it):
#   /opt/trackio/
#     app/                 <- questo repo clonato (git clone .../bwlab/Trackio.git app)
#     docker-compose.yml    <- copia di questo file
#     .env                  <- segreti, non versionato (vedi .env.example)
#
# docker compose up -d --build

services:
  db:
    image: postgres:17-alpine
    container_name: trackio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trackio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: trackio
    volumes:
      - trackio-db-data:/var/lib/postgresql/data

  web:
    build: ./app/web
    container_name: trackio-web
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8092:3000"
    depends_on:
      - db

volumes:
  trackio-db-data:
